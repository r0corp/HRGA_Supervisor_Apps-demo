<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · HRGA Supervisor Apps</title>
    <script>
        (() => {
            let stored = null;
            try {
                stored = localStorage.getItem("lte-theme");
            } catch (e) {}
            const dark = stored === "dark" || (stored === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.9.1/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-body-tertiary d-flex align-items-center min-vh-100">
<div class="container" style="max-width: 560px">
    <div class="page-header-card">
        <div class="page-header-left">
            <div class="page-header-icon"><i class="bi bi-exclamation-triangle"></i></div>
            <h2 class="page-header-title">{% block heading %}{% endblock %}</h2>
        </div>
    </div>
    {% block content %}{% endblock %}
</div>
</body>
</html>
