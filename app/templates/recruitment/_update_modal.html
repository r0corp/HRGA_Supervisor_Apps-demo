{# Modal tambah action plan. Tombol pemicu: data-bs-toggle="modal" data-bs-target="#updateModal"
   data-action="<url>" data-label="<nama posisi>" #}
<div class="modal fade" id="updateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form method="post" class="modal-content">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ request.full_path }}">
            <div class="modal-header">
                <h5 class="modal-title fs-6"><i class="bi bi-plus-circle me-2"></i>Action plan · <span class="js-label"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
            </div>
            <div class="modal-body">
                <div class="form-field-row"><label>Tanggal</label>
                    <div class="field"><input type="date" name="date" value="{{ now().date().isoformat() }}" class="form-control form-control-sm">
                        <div class="form-text">Tampil di report WA sebagai (dd/mm/yy). Kosongkan untuk keterangan tanpa tanggal.</div></div></div>
                <div class="form-field-row"><label class="required">Action plan</label>
                    <div class="field"><textarea name="text" rows="3" class="form-control form-control-sm" required
                        placeholder="mis. 2 Candidate User Interview"></textarea></div></div>
                <div class="form-field-row"><label>Ubah stage</label>
                    <div class="field"><select name="stage" class="form-select form-select-sm js-stage">
                        <option value="">(tidak berubah)</option>
                        {% for s in options('rec_stage') %}<option>{{ s }}</option>{% endfor %}
                    </select></div></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                <button class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i>Simpan</button>
            </div>
        </form>
    </div>
</div>
<script>
    (function () {
        const modal = document.getElementById("updateModal");
        modal.addEventListener("show.bs.modal", function (ev) {
            const btn = ev.relatedTarget;
            const form = modal.querySelector("form");
            form.action = btn.dataset.action;
            modal.querySelector(".js-label").textContent = btn.dataset.label;
            form.querySelector("textarea").value = "";
            form.querySelector(".js-stage").value = "";
        });
        modal.addEventListener("shown.bs.modal", function () {
            modal.querySelector("textarea").focus();
        });
    })();
</script>
