{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}
{% block heading %}Ganti Password{% endblock %}
{% block heading_icon %}bi-key{% endblock %}
{% block heading_subtitle %}Minimal 8 karakter{% endblock %}
{% block content %}
<div class="card" style="max-width: 560px">
    <div class="card-body">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-field-row"><label>Password lama</label>
                <div class="field"><input type="password" name="old_password" class="form-control form-control-sm" required></div></div>
            <div class="form-field-row"><label>Password baru</label>
                <div class="field"><input type="password" name="new_password" class="form-control form-control-sm" minlength="8" required></div></div>
            <div class="form-field-row"><label>Ulangi password baru</label>
                <div class="field"><input type="password" name="confirm_password" class="form-control form-control-sm" minlength="8" required></div></div>
            <button class="btn btn-primary btn-sm">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
